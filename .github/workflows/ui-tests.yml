name: UI tests (Playwright)

on:
  pull_request:
  schedule:
    - cron: "30 9 * * *" # 02:30 America/Vancouver
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static-checks
    env:
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TEST_ENV: ci
      BUYER_USERNAME: ${{ secrets.BUYER_USERNAME }}
      BUYER_PASSWORD: ${{ secrets.BUYER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # PRs only need Chromium. The nightly run covers every browser.
      - name: Install browsers
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npx playwright install --with-deps
          else
            npx playwright install --with-deps chromium
          fi

      - name: Security tests (no retries)
        run: npm run test:security -- --project=chromium

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            npx playwright test
          else
            npx playwright test --project=chromium
          fi

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            results/junit.xml
          retention-days: 14
